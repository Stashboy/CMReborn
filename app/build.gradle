plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.cmreborn'
    compileSdkVersion 'android-36.1'

    defaultConfig {
        applicationId 'dev.cmreborn'
        minSdk 26
        targetSdk 36
        versionCode 31
        versionName '1.1.29'
    }

    buildTypes {
        debug {
            buildConfigField 'boolean', 'DISCOVERY_ONLY', providers.gradleProperty('cmreborn.discoveryOnly').orElse('false').get()
            minifyEnabled false
            debuggable true
        }
        release {
            buildConfigField 'boolean', 'DISCOVERY_ONLY', 'false'
            minifyEnabled false
            debuggable false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    implementation 'org.luckypray:dexkit:2.3.0'
    testImplementation 'junit:junit:4.13.2'
}
